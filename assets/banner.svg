<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Juanan - AI agents, infrastructure, homelab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#a371f7"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.6"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <g stroke="url(#ac)" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M820 70 L930 150 L1050 90 L1130 190"/><path d="M930 150 L900 240 L1030 230 L1130 190"/><path d="M820 70 L760 170 L900 240"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="820" cy="70" r="7" fill="#58a6ff"><animate attributeName="r" values="5;9;5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="150" r="9" fill="#a371f7"><animate attributeName="r" values="7;11;7" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="90" r="6" fill="#3fb950"><animate attributeName="r" values="4;8;4" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="190" r="8" fill="#58a6ff"><animate attributeName="r" values="6;10;6" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="240" r="6" fill="#a371f7"><animate attributeName="r" values="4;8;4" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="230" r="5" fill="#3fb950"><animate attributeName="r" values="3;7;3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="170" r="5" fill="#58a6ff"><animate attributeName="r" values="3;7;3" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <circle r="3" fill="#fff"><animateMotion dur="4s" repeatCount="indefinite" path="M820 70 L930 150 L1050 90 L1130 190"/></circle>
  <text x="60" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#8b949e">$ whoami</text>
  <text x="60" y="185" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#ac)">Juanan</text>
  <text x="62" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#c9d1d9">AI agents  ·  Infrastructure  ·  Homelab<tspan fill="#58a6ff"> _</tspan></text>
  <rect x="60" y="248" width="260" height="3" rx="2" fill="url(#ac)"><animate attributeName="width" values="40;260;40" dur="5s" repeatCount="indefinite"/></rect>
</svg>
